name: Bank source smoke test
on:
  workflow_dispatch:
    inputs:
      date:
        description: Requested date (YYYY-MM-DD)
        required: true
      providers:
        description: Comma-separated bank IDs
        default: CBAR,ECB,NBKR,NBRB
        required: true
permissions:
  contents: read
jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm test
      - name: Collect official data
        env:
          REQUEST_DATE: ${{ inputs.date }}
          BANK_IDS: ${{ inputs.providers }}
        run: node src/cli.mjs --date "$REQUEST_DATE" --providers "$BANK_IDS" --output smoke-data
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bank-smoke-data
          path: smoke-data
          retention-days: 7
