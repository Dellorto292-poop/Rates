name: Bank source smoke test
on:
  pull_request:
    paths:
      - src/providers.mjs
      - src/model.mjs
      - src/http.mjs
      - .github/workflows/bank-smoke.yml
  workflow_dispatch:
    inputs:
      date:
        description: Requested date (YYYY-MM-DD)
        required: true
      providers:
        description: Comma-separated bank IDs
        default: CBAR,ECB,NBKR,NBRB
        required: true
permissions:
  contents: read
jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm test
      - name: Probe CBAR DNS, TCP and TLS
        if: github.event_name == 'workflow_dispatch' && inputs.providers == 'CBAR'
        continue-on-error: true
        env:
          REQUEST_DATE: ${{ inputs.date }}
        run: |
          node scripts/probe-cbar.mjs "$REQUEST_DATE" &
          probe_pid=$!
          for host in www.cbar.az cbar.az; do
            curl --proto '=https' --connect-timeout 40 --max-time 45 --silent --show-error --output /dev/null --write-out "host=$host http=%{http_code} dns=%{time_namelookup}s tcp=%{time_connect}s tls=%{time_appconnect}s total=%{time_total}s\n" "https://$host/currencies/$(date -d "$REQUEST_DATE" +%d.%m.%Y).xml" &
          done
          wait "$probe_pid" || true
          wait || true
      - name: Collect official data
        env:
          REQUEST_DATE: ${{ inputs.date }}
          BANK_IDS: ${{ inputs.providers }}
        run: node src/cli.mjs --date "${REQUEST_DATE:-$(date -u +%F)}" --providers "${BANK_IDS:-CBAR,ECB,NBKR,NBRB}" --output smoke-data
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bank-smoke-data
          path: smoke-data
          retention-days: 7
