name: Update Rates

on:
  workflow_dispatch:
    inputs:
      backfill:
        description: Fill missing dates in the six-month archive
        type: boolean
        default: false
  schedule:
    - cron: '17 */6 * * *'

permissions:
  contents: read

concurrency:
  group: rates-production
  cancel-in-progress: false

jobs:
  collect:
    if: github.repository == 'Dellorto292-poop/Rates' && github.ref == 'refs/heads/main' && vars.RATES_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    outputs:
      outcome: ${{ steps.update.outcome }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: codex/rates-data
          path: state
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - run: npm ci --ignore-scripts
      - run: npm test
      - name: Collect official publications
        id: update
        continue-on-error: true
        env:
          RATES_DATA_DIR: state
          RATES_BACKFILL: ${{ inputs.backfill || 'false' }}
        run: npm run update
      - name: Prepare validated data only
        env:
          RATES_DATA_DIR: state
          RATES_DATE: ${{ steps.update.outputs.date }}
        run: npm run release -- --date "$RATES_DATE"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: checkpoint
          path: checkpoint/
          retention-days: 2
          if-no-files-found: error
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa
        with:
          path: public/
          retention-days: 2

  checkpoint:
    needs: collect
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: codex/rates-data
          path: state
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: checkpoint
          path: checkpoint
      - name: Validate and save history
        run: node src/persist-state.mjs checkpoint state

  deploy:
    needs: [collect, checkpoint]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy validated JSON
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e

  bank-health:
    needs: [collect, deploy]
    if: needs.collect.outputs.outcome == 'failure'
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - run: |
          echo 'One or more bank updates failed. Failure statuses were published; inspect the collection log.'
          exit 1
